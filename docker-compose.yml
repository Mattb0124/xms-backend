# Local environment for the XMS API and worker (Implementation Plan P1.1.5).
# PostgreSQL 16 with pgvector, and MailHog for outbound email. LocalStack for
# S3 and SQS lands with the attachments and outbox work (P1.5.3, P1.6.1).
services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: xms-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - xms-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: xms-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  xms-pgdata:
